spring.security.oauth2.client.registration.github.client-id=app
spring.security.oauth2.client.registration.github.client-secret=secret
spring.security.oauth2.client.registration.corporate.client-id=app
spring.security.oauth2.client.registration.corporate.provider=sso
spring.security.oauth2.client.provider.sso.issuer-uri=https://sso.example.com
spring.security.oauth2.client.registration.legacy.client-id=app
spring.security.oauth2.client.registration.legacy.authorization-grant-type=password
spring.security.oauth2.client.provider.legacy.token-uri=https://legacy.example.com/token
