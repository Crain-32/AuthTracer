spring.grpc.client.channel.greeter.target=static://localhost:9090
spring.security.oauth2.client.registration.greeter.provider=auth
spring.security.oauth2.client.registration.greeter.client-id=greeter-service
spring.security.oauth2.client.registration.greeter.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.greeter.scope=greetings.read,greetings.audit
spring.security.oauth2.client.provider.auth.token-uri=http://localhost:9000/oauth2/token
spring.security.oauth2.client.registration.portal.authorization-grant-type=authorization_code
