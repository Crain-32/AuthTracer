spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: employees
              uri: http://localhost:8082
              predicates:
                - Path=/api/employees/**
                - Method=GET
              filters:
                - StripPrefix=1
            - id: internal
              uri: lb://employee-service
              predicates:
                - Path=/admin/**
              filters:
                - RewritePath=/admin/(?<segment>.*), /internal/$\{segment}
                - RemoveRequestHeader=Authorization
