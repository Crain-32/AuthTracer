spring.security.oauth2.resourceserver.jwt.issuer-uri=http://idp:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://idp:9000/oauth2/jwks
spring.security.oauth2.client.registration.reports.client-id=reports
spring.security.oauth2.client.registration.reports.client-secret=secret
spring.security.oauth2.client.registration.reports.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.reports.token-uri=http://idp:9000/oauth2/token
