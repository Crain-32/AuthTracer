plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    // Generates employee-service's directory stub and messages from src/main/proto.
    id 'com.google.protobuf' version '0.9.5'
}

group = 'dev.crain'
version = '0.0.1-SNAPSHOT'
description = 'payroll-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Built with JDK 25 but emitted as Java 21 class files, like profile-service.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.35.1' }
    plugins {
        grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.83.1' }
    }
    generateProtoTasks { all().configureEach { it.plugins { grpc {} } } }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    // payroll-service's own token, from identity-service, for the calls no user is behind.
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-client'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-zipkin'
    implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-grpc-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
