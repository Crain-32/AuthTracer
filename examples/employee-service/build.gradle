plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    // Generates the gRPC directory's base class and messages from src/main/proto.
    id 'com.google.protobuf' version '0.9.5'
}

group = 'dev.crain'
version = '0.0.1-SNAPSHOT'
description = 'employee-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Built with JDK 25 but emitted as Java 17 class files, so AuthTracer's analyzer sees several class-file versions.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.35.1' }
    plugins {
        grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.83.1' }
    }
    generateProtoTasks { all().configureEach { it.plugins { grpc {} } } }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-zipkin'
    implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
    implementation 'jakarta.annotation:jakarta.annotation-api'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-grpc-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
