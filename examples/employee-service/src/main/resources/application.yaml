spring:
  application:
    name: employee-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  grpc:
    server:
      port: 9082
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # The consumers read the payload into their own types.
        spring.json.add.type.headers: false
    template:
      observation-enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        observation-enabled: true

server:
  port: 8082

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health
