syntax = "proto3";

// employee-service's directory for other services (payroll-service reads it). A copy lives in each service that calls
// it; keep them the same.
package employees.v1;

option java_multiple_files = true;
option java_package = "dev.crain.employees.v1";

service EmployeeDirectory {
  rpc GetEmployee (GetEmployeeRequest) returns (EmployeeRecord);
}

message GetEmployeeRequest {
  int64 id = 1;
}

message EmployeeRecord {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  // A decimal, unset when the caller may not see it (only ADMIN and AUDITOR may).
  optional string salary = 5;
  string manager_username = 6;
}
