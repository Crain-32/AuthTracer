import org.springframework.boot.gradle.plugin.SpringBootPlugin

// The scanner: one application's bytecode, libraries and configuration in, its authorization graph out. A library with
// no server in it, for the command line, the scanner image and build plugins to share. Its tests and fixtures are the
// root project's, which test it through its dependency on this one.
plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Versions as Spring Boot manages them, for this project and those that use it.
    api platform(SpringBootPlugin.BOM_COORDINATES)
    implementation project(':annotations')
    // The scan's API hands out SootUp's types, and the graph's records carry Jackson's annotations.
    api 'org.soot-oss:sootup.core:3.0.1'
    api 'org.soot-oss:sootup.java.core:3.0.1'
    api 'org.soot-oss:sootup.java.bytecode.frontend:3.0.1'
    implementation 'org.soot-oss:sootup.callgraph:3.0.1'
    api 'tools.jackson.core:jackson-databind'
    // Spring's own readers: application.properties and .yaml, SpEL, path patterns.
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework:spring-expression'
    implementation 'org.springframework:spring-web'
    implementation 'org.yaml:snakeyaml'
    // Spring Data REST's pluralizer, for the paths it exports repositories at (decision 0040).
    implementation 'org.atteo:evo-inflector:1.3'
    implementation 'org.slf4j:slf4j-api'
}
