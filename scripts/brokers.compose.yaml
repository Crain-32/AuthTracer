# The example services' message brokers: Kafka (employee-service's salary changes, which payroll-service consumes) and
# RabbitMQ (profile-service's audit events, which employee-service consumes). scripts/demo.sh and the system test
# start them when they need them; KAFKA_PORT and RABBITMQ_PORT move them off 9092 and 5672.
#
#   docker compose -f scripts/brokers.compose.yaml up -d --wait
name: authtracer-brokers
services:
  kafka:
    # Kafka compiled to a native binary: one broker that starts in a second and needs little memory, for development.
    image: apache/kafka-native:4.3.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Clients reach the broker through the published port, so that is the address it gives them.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      # One consumer group of one member: no point waiting for others to join.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The native image takes up to 80% of the memory it sees; two topics need far less.
      KAFKA_OPTS: -Xmx256m
    healthcheck:
      # Up once its port takes connections: checked every second while it starts, then now and then.
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      start_period: 60s
      start_interval: 1s
      interval: 30s
  rabbitmq:
    image: rabbitmq:4.3.5-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
    healthcheck:
      # RabbitMQ opens its AMQP port last as it boots. (rabbitmq-diagnostics starts an Erlang VM a time: half a core.)
      test: ["CMD", "nc", "-z", "localhost", "5672"]
      start_period: 60s
      start_interval: 1s
      interval: 30s
