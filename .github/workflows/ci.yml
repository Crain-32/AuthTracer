# On every pull request to main and every push to it: the tests (`check`, then `systemTest` with Docker), and on a pull
# request, AuthTracer's own pull-request check on each example service against the pull request's base.
#
# Actions are pinned to commits, with their release after each. The token can only read: a pull request from a fork runs
# its code here, so nothing in this workflow may write.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request (or branch) cancels the run it makes stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (unit, UI, integration, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The open-source cache on GitHub's own cache, not the commercial one the action defaults to. It also checks the
      # Gradle wrappers' checksums, the examples' too.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - run: ./gradlew check --continue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: check-reports
          path: |
            build/reports/
            build/test-results/
            scanner-image/build/reports/
          retention-days: 14

  system:
    name: systemTest (services, brokers, Zipkin, scanner image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - run: ./gradlew systemTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: system-reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 14

  # What AuthTracer is for, on its own examples: a pull request that weakens a service's authorization fails here. The
  # reports are on the run's summary page.
  pr-check:
    name: pull-request check (example services)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff checks the base revision out in a worktree of its own.
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: authtracerDiff on each example service
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          status=0
          for service in profile-service employee-service identity-service payroll-service; do
            report="build/reports/authtracer/$service.md"
            echo "::group::$service"
            ./gradlew authtracerDiff -PdiffProject="examples/$service" -PbaseRef="origin/$BASE_REF" \
                -Preport="$report" || status=1
            echo "::endgroup::"
            if [ -f "$report" ]; then
              { echo "## $service"; echo; cat "$report"; echo; } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$service: no report (the diff didn't run)"
            fi
          done
          exit $status
